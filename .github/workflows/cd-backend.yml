name: CD Backend (Vercel)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "contracts/**"
      - ".github/workflows/cd-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-backend-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt

      - name: Install ffmpeg and CJK fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk

      - name: Setup Python 3.12 environment
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r backend/requirements.txt

      - name: Run Python regression & OpenAPI parity suite
        run: .venv/bin/python scripts/test-python.py

      - name: Verify Vercel FastAPI ASGI entrypoint
        run: .venv/bin/python -c "import sys; sys.path.insert(0, 'backend'); from api.index import app; assert app is not None"

  deploy:
    name: Deploy napda-api to Vercel
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel deployment credentials
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=()
          [ -n "${VERCEL_TOKEN:-}" ] || missing+=("VERCEL_TOKEN")
          [ -n "${VERCEL_ORG_ID:-}" ] || missing+=("VERCEL_ORG_ID")
          [ -n "${VERCEL_PROJECT_ID:-}" ] || missing+=("VERCEL_PROJECT_ID")

          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "### Vercel Backend Deploy Skipped (Missing Secrets)"
            echo "Missing GitHub Actions secrets: \`${missing[*]}\`"
            echo ""
            echo "1. Create a Vercel token at https://vercel.com/account/tokens"
            echo "2. Run \`gh secret set VERCEL_TOKEN\` in this repository"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}. Create a Vercel token at https://vercel.com/account/tokens and run 'gh secret set VERCEL_TOKEN'."
            exit 1
          fi

          echo "::warning::Skipping Vercel deploy because secret(s) are not configured: ${missing[*]}. Create a token at https://vercel.com/account/tokens and run 'gh secret set VERCEL_TOKEN'."
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        if: steps.creds.outputs.ready == 'true'
        run: npm install -g vercel@latest

      - name: Deploy backend to Vercel production
        id: deploy_step
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cd backend
          DEPLOY_URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Post-deploy smoke check
        if: steps.creds.outputs.ready == 'true'
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS https://napda-api.vercel.app/health | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('status') == 'ok', d" \
              && curl -fsS https://napda-api.vercel.app/v1/billing/config | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('enabled') is True, d"; then
              echo "Smoke check passed on attempt $attempt"
              exit 0
            fi
            echo "Smoke check attempt $attempt failed; retrying in 5s..."
            sleep 5
          done
          echo "::error::Post-deploy smoke check failed against https://napda-api.vercel.app"
          exit 1
