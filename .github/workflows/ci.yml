name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python-backend:
    name: Python & Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt

      - name: Install ffmpeg and CJK fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk

      - name: Setup Python 3.12 environment
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r backend/requirements.txt

      - name: Run Python regression & OpenAPI parity suite
        run: .venv/bin/python scripts/test-python.py

      - name: Verify Vercel FastAPI ASGI entrypoint
        run: .venv/bin/python -c "import sys; sys.path.insert(0, 'backend'); from api.index import app; assert app is not None"

  node-workspace:
    name: Node Planner & Prototype
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

      - name: Typecheck planner workspace
        run: npm run typecheck

      - name: Build planner workspace
        run: npm run build

      - name: Build prototype bundle
        run: npm run build:prototype
