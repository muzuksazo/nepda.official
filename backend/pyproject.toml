[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shortform-ad-production"
version = "0.1.0"
description = "Production google-genai worker and API for shortform A/B/C ad remixing"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=3.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pillow>=10.0.0",
  "numpy>=1.26.0",
  "boto3>=1.35.0",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
